#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Sun Aug 30 03:09:51 GMT 2026
org.gradle.daemon.idletimeout=10800000
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2048m -XX\:MaxMetaspaceSize\=512m -XX\:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8
android.enableJetifier=true
android.useAndroidX=true
android.aapt2FromMavenOverride=/data/user/0/com.tom.rv2ide/files/home/.androidide/aapt2

# Slow mobile networks: a 30 s socket timeout aborts 3-10 MB artifacts mid-download.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000
